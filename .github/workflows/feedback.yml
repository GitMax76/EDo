name: Filtro feedback - due al mese
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: read
  issues: write
jobs:
  moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const moderate = require('./scripts/moderate-feedback.cjs');
            await moderate({github, context, core});
