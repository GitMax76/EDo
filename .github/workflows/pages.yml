name: Verifica e pubblica E.Do.-Fa
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica JavaScript e filtro feedback
        run: |
          node --check docs/app.js
          node --check docs/feedback.js
          node --check docs/ui-settings.js
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_weekly_report.py'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
